name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: release notes from the changelog
        run: bash ci/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@v5
        with:
          go-version-file: catalog/go.mod
          cache-dependency-path: "*/go.sum"
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: gofmt, vet, lint and tests
        run: make check
      - name: packages for amd64 and arm64
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
