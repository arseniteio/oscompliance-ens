name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: catalog/go.mod
          cache-dependency-path: "*/go.sum"
      - name: gofmt, vet and tests
        run: make check
      - name: packages for amd64 and arm64
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
