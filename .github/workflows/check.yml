name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: catalog/go.mod
          cache-dependency-path: "*/go.sum"
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: gofmt, vet, lint and tests
        run: make check
      - name: build the agent for amd64 and arm64
        run: |
          cd agent
          GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/oscompliance-agent
          GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/oscompliance-agent
      - name: build the engine
        run: cd engine && CGO_ENABLED=0 go build -o /dev/null ./cmd/oscompliance-engine
