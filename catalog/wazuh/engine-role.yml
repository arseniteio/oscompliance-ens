# Least-privilege role for the engine's indexer user (roles.yml format), checked
# against Wazuh indexer 4.14.7. Recommended, not required.

oscompliance_engine:
  reserved: false
  cluster_permissions:
    - "cluster_composite_ops_ro"
    # Retention of the alerts index (op.exp.8 EV-07, mp.s.3 EV-08).
    - "cluster:admin/opendistro/ism/managedindex/explain"
    - "cluster:admin/opendistro/ism/policy/get"
  index_permissions:
    - index_patterns:
        - "wazuh-alerts-*"
        - "wazuh-monitoring-*"
        - "wazuh-states-inventory-*"
        - "wazuh-states-vulnerabilities-*"
        - "wazuh-ens-configuration"
      allowed_actions:
        - "read"
    - index_patterns:
        - "oscompliance-verdicts"
        - "oscompliance-identity-history"
        - "oscompliance-config-history"
      allowed_actions:
        - "create_index"
        - "manage_mapping"
        - "crud"
        - "indices:admin/get"
        - "indices:admin/refresh*"
        - "indices:data/write/bulk*"
